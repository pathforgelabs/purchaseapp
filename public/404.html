<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearth &amp; Home</title>
  </head>
  <body>
    <script>
      const base = '/purchaseapp'
      const route = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length)
        : window.location.pathname
      window.location.replace(`${base}/?route=${encodeURIComponent(route)}${window.location.search}${window.location.hash}`)
    </script>
  </body>
</html>
